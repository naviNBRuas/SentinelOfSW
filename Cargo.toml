[package]
name = "sentinel"
version = "0.1.0"
edition = "2021"

[dependencies]
# UI and TUI
ratatui = { version = "0.29", features = ["all-widgets"] }
crossterm = "0.28"

# Async Runtime
tokio = { version = "1.42", features = ["full"] }

# Async Traits
async-trait = "0.1"

# Graph Processing
petgraph = "0.6"

# CLI Parsing
clap = { version = "4.5", features = ["derive"] }

# Data & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Error Handling
anyhow = "1.0"
# Logging/Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Networking
reqwest = { version = "0.12", features = ["json"] }
hickory-resolver = "0.25"

# Time & Chrono
chrono = "0.4"

# Tool detection
which = "7.0"
rand = "0.10.1"
sha1 = "0.11.0"
md-5 = "0.11.0"
regex = "1.12.4"


